[package]
name = "nanoodle"
version = "0.1.1"
edition = "2021"
description = "Rust executor for nanoodle graphs — same frozen format, conformance-suite proven"
license = "MIT"
repository = "https://github.com/nanoodlecom/nanoodle-rs"
homepage = "https://nanoodle.com"

[[bin]]
name = "nanoodle-rs"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = { version = "3", features = ["rustls", "json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
