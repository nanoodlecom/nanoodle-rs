[package]
name = "nanoodle"
version = "0.3.0"
edition = "2021"
description = "Rust executor for nanoodle graphs — same frozen format, conformance-suite proven"
license = "MIT"
repository = "https://github.com/nanoodlecom/nanoodle-rs"
homepage = "https://nanoodle.com"

[[bin]]
name = "nanoodle-rs"
path = "src/main.rs"

[dependencies]
libwebp-sys = { version = "0.14.4", default-features = false }
serde_json = "1"
ureq = { version = "3", features = ["rustls", "json"] }

# Compile the packaged AVIF decoder into the executor.
[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
